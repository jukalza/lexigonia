<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>
    <div id="book-detail-container">
        <div class="book-detail">
          <h1 id="book-title"></h1>
          <h3 id="book-authors"></h3>
          <img id="book-thumbnail" src="" alt="Book cover">
      
          <p>
            <span id="book-description"></span>
          </p>
      
          <div class="info-row">
            <img src="./images/icons/calendar.png" alt="Published" class="info-icon">
            <strong> Published: </strong>
            <span id="book-published"></span>
          </div>
      
          <div class="info-row">
            <img src="./images/icons/tag.svg" alt="Categories" class="info-icon">
            <strong> Categories: </strong>
            <span id="book-categories"></span>
          </div>
      
          <div class="info-row">
            <img src="./images/icons/rating.svg" alt="Rating" class="info-icon">
            <strong> Average Rating: </strong>
            <span id="book-rating"></span>
          </div>
      
          <p id="book-preview">
          </p>
       
          <a id="back-link" href="home.html">Back to Search</a>

        </div>
    </div>

    <script src="book.js"></script>
</body>
</html>
