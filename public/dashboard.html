<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lexigonia - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css"/>
  <link rel="stylesheet" href="navbar.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="navbar.mjs"></script>
</head>
<body>

    <header></header>

    <div class="dashboard-container">
        <aside class="sidebar">
          <h2>Your Collections</h2>
          <ul>
            <li><a href="#have-read">Have Read</a></li>
            <li><a href="#currently-reading">Currently Reading</a></li>
            <li><a href="#want-to-read">Want to Read</a></li>
          </ul>
          <button id="logout">Logout</button>
        </aside>
    
        <main class="main-content">
          <h2 id="username-heading" class="username-heading"></h2>
          <section id="have-read">
            <h3>Have Read</h3>
            <div class="books-grid" id="have-read-list">
            </div>
          </section>
    
          <section id="currently-reading">
            <h3>Currently Reading</h3>
            <div class="books-grid" id="currently-reading-list">
            </div>
          </section>
    
          <section id="want-to-read">
            <h3>Want to Read</h3>
            <div class="books-grid" id="want-to-read-list">
            </div>
          </section>
        </main>
      </div>
  <script type="module" src="dashboard.mjs"></script>
</body>
</html>
