<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lexigonia - Book Details</title>
    <link rel="stylesheet" href="book.css">
    <link rel="stylesheet" href="navbar.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="navbar.mjs"></script>
</head>
<body>

    <header></header>

    <h2 id="login-message" class="login-message">
      Login to leave a review or add book to a collection!
    </h2>

    <div id="book-detail-container">

        <div id="loading" style="display: none;">
            <img src="./images/loading.gif" alt="loading">
        </div>

        <div class="book-detail">

            <div class="book-header">
                <img id="book-thumbnail" src="" alt="Book cover">
            
                <div class="collection-dropdown">
                  <button id="collection-button">Add to Collection</button>
                  <div id="collection-options" class="dropdown-content">
                    <button class="collection-option" data-type="have_read">Have Read</button>
                    <button class="collection-option" data-type="currently_reading">Currently Reading</button>
                    <button class="collection-option" data-type="want_to_read">Want to Read</button>
                  </div>
                </div>
            </div>


          <h1 id="book-title"></h1>
          <h3 id="book-authors"></h3>

          <p>
            <span id="book-description"></span>
          </p>
      
          <div class="info-row">
            <img src="./images/icons/calendar.png" alt="Published" class="info-icon">
            <strong> Published: </strong>
            <span id="book-published"></span>
          </div>
      
          <div class="info-row">
            <img src="./images/icons/tag.svg" alt="Categories" class="info-icon">
            <strong> Categories: </strong>
            <span id="book-categories"></span>
          </div>
      
          <div class="info-row">
            <img src="./images/icons/rating.svg" alt="Rating" class="info-icon">
            <strong> Average Rating: </strong>
            <span id="book-rating"></span>
          </div>
      
          <p id="book-preview">
          </p>
       
          <a id="back-link" href="home.html">Back to Search</a>

        </div>
    </div>

    <div id="review-section">
        <h2>Rate and Review</h2>
        <form id="review-form">
            <label for="rating">Rating (1-5):</label>
            <input type="number" id="rating" name="rating" min="1" max="5" required>

            <label for="review-text">Review (Optional):</label>
            <textarea id="review-text" name="review-text"></textarea>

            <button type="submit">Submit</button>
        </form>

        <div id="reviews">
            <h3>Reviews</h3>
        </div>
    </div>

    <script type="module" src="book.mjs"></script>
</body>
</html>
